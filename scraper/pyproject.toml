[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "24-hour-party-people-scraper"
version = "0.0.0"
description = "Private Powerleague scraper service for 24 Hour Party People"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.14.3",
  "fastapi==0.135.1",
  "python-dotenv==1.2.1",
  "requests==2.32.5",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
