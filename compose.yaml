services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: party_people
      POSTGRES_PASSWORD: party_people
      POSTGRES_USER: party_people
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U party_people -d party_people']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    profiles: ['test']
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: party_people_test
      POSTGRES_PASSWORD: party_people_test
      POSTGRES_USER: party_people_test
    ports:
      - '55432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U party_people_test -d party_people_test']
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
